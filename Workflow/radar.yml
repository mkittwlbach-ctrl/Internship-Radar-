name: Radar

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Karriereseiten pruefen
        run: |
          mkdir -p daten
          python scraper.py
      - name: Ergebnis speichern
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add daten
          git commit -m "Radar $(date -u +%Y-%m-%d)" || echo "keine Aenderung"
          git push
