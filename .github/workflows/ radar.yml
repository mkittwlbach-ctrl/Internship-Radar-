name: Radar

on:
  schedule:
    - cron: "23 3 * * *"   # Hauptlauf ca. 3:23 UTC (Lissabon 3:23 Winter / 4:23 Sommer)
    - cron: "53 4 * * *"   # Sicherheitslauf, falls der erste ausfaellt
  workflow_dispatch:        # Knopf "Run workflow"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Werkzeuge installieren
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Karriereseiten pruefen
        run: python scraper.py
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git pull --rebase || true
          git add daten
          git commit -m "Radar $(date -u +%Y-%m-%d_%H%M)" || echo "keine Aenderung"
          git push
